<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Refugio Marino · Panel de caja</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font-sans:"Plus Jakarta Sans",sans-serif;
  --font-script:"Kaushan Script",cursive;
  --navy:#0B3C5D;
  --teal:#0E6B64;
  --fondo:#F1F2F4;
  --card:#FFFFFF;
  --borde:#E3E5E8;
  --txt:#14263A;
  --muted:#3E5160;
  --azul:#0B3C5D;
  --azul-osc:#072B44;
  --libre:#1C6B43;
  --reservada:#8C5D00;
  --ocupada:#A23422;
  --llamado:#9F1239;
  --gap:18px;
  --mesa:124px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:16px;background:var(--fondo);color:var(--txt);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}

header{display:flex;flex-direction:column;gap:10px;padding:10px 22px 12px;background:#fff;border-bottom:1px solid var(--borde);box-shadow:0 2px 10px rgba(11,60,93,.08)}
.fila{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:12px;min-width:0}
.marca img{height:58px;width:58px;display:block;border-radius:50%}
.marca img.vacio{display:none}
.marca h1{font-family:var(--font-script);font-weight:400;font-size:34px;color:var(--navy);line-height:1.05}
.marca p{font-family:var(--font-sans);font-size:14px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--teal);margin-top:2px}
.esp{margin-left:auto}
#buscar{width:min(280px,100%);min-height:44px;padding:8px 12px;border:2px solid #C5CED6;border-radius:12px;background:#fff;font-size:16px}
.filtros{display:flex;flex-wrap:wrap;gap:8px}
.filtros button{min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid #C5CED6;background:#fff;color:var(--txt);font-weight:700;font-size:14px}
.filtros button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
#btnSonido,#btnSalir{min-height:44px;padding:8px 14px;border-radius:12px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:800;font-size:14px}
#btnSonido[aria-pressed="true"]{background:var(--navy);color:#fff}
.estado{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--navy);white-space:nowrap}
.estado .pto{width:10px;height:10px;border-radius:50%;background:var(--libre);display:inline-block}
.estado .pto.recon{background:var(--reservada)}
.estado .pto.off{background:var(--muted)}

.wrap{flex:1;display:flex;gap:var(--gap);padding:var(--gap);min-height:0}
#mapa{flex:1;min-width:0;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;align-items:flex-start;align-content:flex-start;gap:var(--gap)}
.vacio-mapa{width:100%;color:var(--txt);font-size:16px;padding:24px}
.salon{width:max-content;max-width:100%;height:auto;background:var(--card);border:1px solid var(--borde);border-radius:18px;box-shadow:0 4px 18px rgba(11,60,93,.06);padding:14px 14px 16px}
.salon h2{font-size:22px;font-weight:800;color:var(--azul);margin-bottom:12px;line-height:1.2}
.grilla{display:grid;grid-template-columns:repeat(3,var(--mesa));gap:12px;justify-content:start;align-content:start}
.mesa{width:var(--mesa);height:var(--mesa);border-radius:12px;background:#fff;border:1px solid #D5DCE3;box-shadow:0 3px 10px rgba(20,38,58,.10);position:relative;user-select:none;--linea:var(--libre)}
.mesa::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:6px;background:var(--linea);border-radius:0 0 12px 12px}
.mesa.reservada{--linea:var(--reservada)}.mesa.ocupada{--linea:var(--ocupada)}.mesa.fuera_servicio{--linea:#5B6878;opacity:.72}
.mesa .forma{position:absolute;left:14%;right:14%;top:22%;bottom:28%;background:#E6EBEF;border-radius:10%;display:flex;align-items:center;justify-content:center;color:var(--txt);font-weight:800;font-size:14px;line-height:1.1;text-align:center;padding:2px}
.mesa .s{position:absolute;background:#3E4C59;border-radius:99px}
.mesa .b{position:absolute;top:-14px;right:-14px;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;font-size:22px;z-index:3}
.mesa.llamando{animation:llama 1.4s ease-in-out infinite;z-index:2;cursor:pointer;border-color:var(--llamado)}
.mesa.llamando .forma{animation:llamaf 1.4s ease-in-out infinite}
.mesa.llamando .b{display:flex;animation:campana 1.4s ease-in-out infinite}
@keyframes llamaf{0%,100%{background:#E6EBEF;color:var(--txt)}50%{background:var(--llamado);color:#fff}}
@keyframes llama{0%,100%{box-shadow:0 0 0 0 rgba(159,18,57,.45)}50%{box-shadow:0 0 0 10px rgba(159,18,57,0)}}
@keyframes campana{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}}

.leyenda{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:12px 22px;background:#fff;border-top:1px solid var(--borde);color:var(--txt)}
.ley-item{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;min-height:32px}
.ley-item b{font-size:16px;font-weight:800}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.libre{background:var(--libre)}.sw.reservada{background:var(--reservada)}.sw.ocupada{background:var(--ocupada)}.sw.llam{background:var(--llamado)}
.ley-item.llam.activo{background:var(--llamado);color:#fff;border-radius:999px;padding:6px 14px;animation:pulso 1.6s ease-in-out infinite}
.ley-item.llam.activo .sw{background:#fff}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(159,18,57,.4)}70%{box-shadow:0 0 0 8px rgba(159,18,57,0)}}

aside{width:280px;flex:none;display:none !important;background:var(--card);border:1px solid var(--borde);border-radius:18px;box-shadow:0 4px 18px rgba(11,60,93,.06);padding:16px;flex-direction:column;min-height:0}
body.con-llamados aside{display:flex !important}
aside h2{font-weight:800;font-size:22px;color:var(--navy);margin-bottom:10px}
#lista{overflow:auto;flex:1}
.vacio-l{color:var(--muted);font-size:16px;text-align:center;margin-top:30px;line-height:1.5}
.item{border:2px solid var(--llamado);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
.item .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.item b{font-size:20px;color:var(--azul-osc);white-space:nowrap}
.item .sal{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tipo{font-size:16px;font-weight:700;margin-top:4px}
.item small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.item button{margin-top:10px;width:100%;min-height:44px;padding:12px;border:none;border-radius:12px;background:var(--libre);color:#fff;font-weight:800;font-size:16px}

.reservas{background:#fff;border-bottom:1px solid var(--borde);padding:12px 22px 14px;display:flex;flex-direction:column;gap:10px}
.reservas-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.reservas h2{font-size:20px;font-weight:800;color:var(--navy);line-height:1.2}
.reservas h2 span{font-weight:700;color:var(--muted);font-size:16px}
#btnReservas{min-height:44px;padding:8px 16px;border-radius:12px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:800;font-size:15px}
.reservas-lista{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.vacio-r{color:var(--muted);font-size:16px;padding:8px 0}
.reserva{flex:none;min-width:240px;min-height:44px;border:1px solid var(--borde);border-radius:14px;padding:10px 12px;background:#fff;box-shadow:0 2px 8px rgba(11,60,93,.05)}
.reserva-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reserva .hora{font-size:18px;font-weight:800;color:var(--navy)}
.reserva .nom{font-size:16px;font-weight:700;margin-top:2px}
.reserva .meta{font-size:14px;color:var(--muted);font-weight:600;margin-top:2px}
.reserva .extras{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;min-height:28px;padding:2px 8px;border-radius:999px;background:#E8EEF4;color:var(--navy);font-size:13px;font-weight:800}
.tag.santi{background:#E3F4EA;color:var(--libre)}
.tag.fiesta{background:#FFF1CC;color:var(--reservada)}

.capa{position:fixed;inset:0;background:rgba(241,242,244,.97);display:flex;align-items:center;justify-content:center;z-index:9}
.capa .caja{background:#fff;border:1px solid var(--borde);border-radius:20px;box-shadow:0 10px 40px rgba(11,60,93,.12);padding:28px;width:min(420px,calc(100% - 32px));text-align:center}
.capa h3{font-family:var(--font-sans);font-weight:800;font-size:28px;color:var(--navy);margin-bottom:8px}
.capa h3.wordmark{font-family:var(--font-script);font-weight:400;font-size:40px;line-height:1.1}
.capa p{color:var(--txt);font-size:16px;line-height:1.45}
.campo{text-align:left;margin-top:14px}
.campo label{display:block;font-size:14px;font-weight:700;color:var(--txt);margin-bottom:6px}
.campo input{margin-top:0}
.pass{position:relative}
.pass input{padding-right:108px}
#verPw{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:auto;min-height:36px;margin:0;padding:6px 10px;background:transparent;color:var(--navy);border:none;font-size:14px;font-weight:800}
.capa input,.capa button{width:100%;padding:13px;margin-top:12px;border-radius:12px;border:1px solid #cfd4da;font-size:16px;font-family:inherit;min-height:48px}
.capa button{background:var(--azul);color:#fff;border:none;font-weight:800}
.capa button.sec{background:#fff;color:var(--navy);border:2px solid var(--navy)}
#lerr{color:#A23422;font-size:14px;margin-top:8px}
@media (prefers-reduced-motion:reduce){
  .ley-item.llam.activo,.mesa.llamando,.mesa.llamando .forma,.mesa.llamando .b{animation:none}
}
</style>
</head>
<body>
<header>
  <div class="fila">
    <div class="marca">
      <img id="logo" src="logo.png" alt="Refugio Marino">
      <div><h1>Refugio Marino</h1><p>Panel de caja</p></div>
    </div>
    <span class="esp"></span>
    <button id="btnSonido" type="button" aria-pressed="false" aria-label="Sonido apagado. Activar sonido">Sonido apagado</button>
    <button id="btnSalir" type="button" hidden>Cerrar sesión</button>
    <span class="estado" id="estado"><i class="pto off"></i> Desconectado</span>
  </div>
  <div class="fila">
    <input id="buscar" type="search" placeholder="Buscar mesa (S1-01)" aria-label="Buscar mesa" autocomplete="off">
    <div class="filtros" role="group" aria-label="Filtrar por estado">
      <button type="button" data-filtro="todas" aria-pressed="true">Todas</button>
      <button type="button" data-filtro="libre" aria-pressed="false">Libre</button>
      <button type="button" data-filtro="reservada" aria-pressed="false">Reservada</button>
      <button type="button" data-filtro="ocupada" aria-pressed="false">Ocupada</button>
      <button type="button" data-filtro="llamando" aria-pressed="false">Llamando</button>
    </div>
  </div>
</header>

<section class="reservas" aria-labelledby="titReservas">
  <div class="reservas-top">
    <h2 id="titReservas">Reservas de hoy <span id="nReservas"></span></h2>
    <button type="button" id="btnReservas" aria-label="Actualizar reservas de hoy">Actualizar</button>
  </div>
  <div id="listaReservas" class="reservas-lista" aria-live="polite"><p class="vacio-r">No hay reservas activas para hoy.</p></div>
</section>

<div class="wrap">
  <div id="mapa"></div>
  <aside><h2>Llamados</h2><div id="lista"></div></aside>
</div>
<footer class="leyenda" id="chips"></footer>

<div class="capa" id="login"><form class="caja" onsubmit="entrar(event)">
  <h3 class="wordmark">Refugio Marino</h3><p>Panel de caja</p>
  <div class="campo">
    <label for="em">Correo</label>
    <input id="em" type="email" placeholder="correo@ejemplo.com" autocomplete="username" required>
  </div>
  <div class="campo">
    <label for="pw">Contraseña</label>
    <div class="pass">
      <input id="pw" type="password" placeholder="Tu contraseña" autocomplete="current-password" required>
      <button type="button" id="verPw" aria-label="Mostrar contraseña">Mostrar</button>
    </div>
  </div>
  <button>Entrar</button><p id="lerr"></p>
</form></div>

<div class="capa" id="activar" style="display:none"><div class="caja" role="dialog" aria-modal="true" aria-labelledby="listoTit">
  <h3 id="listoTit">¡Listo!</h3>
  <p>El panel ya puede recibir llamados. Activa el sonido para oír cuando un cliente llame al mesero.</p>
  <button type="button" id="btnActivarListo">Activar sonido</button>
  <button type="button" id="btnAhoraNo" class="sec">Ahora no</button>
</div></div>

<script type="module">
const SUPABASE_URL='https://idhxedaebgkyfvmliwfv.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkaHhlZGFlYmdreWZ2bWxpd2Z2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMTUxMDIsImV4cCI6MjEwNjg5MTEwMn0.SzjXSfI8z_6rKpXqloAzZz9ylTtMKTuBRMYjbhGjVrs';
const RESTAURANTE_ID=1;
const RECORDAR_CADA_S=30;
const TIPOS={mesero:'Llamar mesero',cuenta:'Pedir la cuenta',servilletas:'Servilletas',otro:'Otro'};
const ESTADO={disponible:'libre',libre:'libre',reservada:'reservada',ocupada:'ocupada',fuera_servicio:'fuera_servicio'};
const $=id=>document.getElementById(id);
const MOCK=window.__MOCK__||null;
let sb=null;
if(!MOCK){const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);}

let MESAS=[],EST={},pend=[],RESERVAS=[];
const ESTADOS_ACTIVOS=['pendiente','confirmada'];
const CANAL={chatbot:'Santi',manual:'Manual',telefono:'Teléfono',walk_in:'Llegada',web:'Web'};
const FIESTA={cumpleaños:'Cumpleaños',grado:'Grado',aniversario:'Aniversario'};
const ESTADO_TXT={pendiente:'Pendiente',confirmada:'Confirmada'};
let filtro='todas', busca='';
const salonNum=m=>parseInt((m.nombre.match(/^S(\d+)/i)||[])[1]||0);
const nombreSalon=n=>{const m=MESAS.find(x=>salonNum(x)===n);return m&&m.zona?m.zona:'Salón '+n};
const mesa=id=>MESAS.find(m=>m.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const llamaMesa=id=>pend.some(p=>p.mesa_id===id);

/* Una silla por lado en todas las mesas, para que ningún salón las dibuje en pares. */
function sillas(){
  const tam=26, ini=50-tam/2;
  return `<i class="s" style="top:8%;height:7%;left:${ini}%;width:${tam}%"></i>`
    +`<i class="s" style="bottom:16%;height:7%;left:${ini}%;width:${tam}%"></i>`
    +`<i class="s" style="left:8%;width:7%;top:${ini-2}%;height:${tam}%"></i>`
    +`<i class="s" style="right:8%;width:7%;top:${ini-2}%;height:${tam}%"></i>`;
}
function mesaVisible(m){
  const e=ESTADO[EST[m.id]]||'libre';
  const q=busca.trim().toLowerCase();
  if(q && !m.nombre.toLowerCase().includes(q) && !String(m.zona||'').toLowerCase().includes(q)) return false;
  if(filtro==='todas') return true;
  if(filtro==='llamando') return llamaMesa(m.id);
  return e===filtro;
}
function dibujar(){
  const mapa=$('mapa');mapa.innerHTML='';if(!MESAS.length)return;
  const salones=[...new Set(MESAS.map(salonNum))].sort((a,b)=>a-b);
  let alguna=false;
  salones.forEach(n=>{
    const ms=MESAS.filter(m=>salonNum(m)===n && mesaVisible(m)).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es',{numeric:true}));
    if(!ms.length)return;
    alguna=true;
    const card=document.createElement('section');card.className='salon';card.innerHTML=`<h2>${esc(nombreSalon(n))}</h2>`;
    const gr=document.createElement('div');gr.className='grilla';gr.style.gridTemplateColumns=`repeat(${Math.min(3,ms.length)},var(--mesa))`;
    ms.forEach(m=>{
      const d=document.createElement('div');d.id='m'+m.id;d.className='mesa';
      d.innerHTML=`<span class="b" aria-hidden="true">🔔</span>${sillas()}<div class="forma">${esc(m.nombre)}</div>`;
      d.title=m.nombre;d.setAttribute('aria-label',m.nombre);
      d.onclick=()=>{const x=pend.find(p=>p.mesa_id===m.id);if(x)atender(x.id)};
      gr.appendChild(d);
    });
    card.appendChild(gr);mapa.appendChild(card);
  });
  if(!alguna)mapa.innerHTML='<p class="vacio-mapa">Ninguna mesa coincide con la búsqueda.</p>';
  pintar();render();
}

function pintar(){
  const c={libre:0,reservada:0,ocupada:0};
  MESAS.forEach(m=>{
    const e=ESTADO[EST[m.id]]||'libre', d=$('m'+m.id);
    if(c[e]!=null)c[e]++;
    if(d){d.classList.remove('libre','reservada','ocupada','fuera_servicio');d.classList.add(e);d.setAttribute('aria-label',m.nombre+', '+(llamaMesa(m.id)?'llamando':e))}
  });
  const llam=pend.length;
  const sig=c.libre+'-'+c.reservada+'-'+c.ocupada+'-'+llam;
  const chips=$('chips');
  if(chips.dataset.sig===sig)return;
  chips.dataset.sig=sig;
  chips.innerHTML=`<span class="ley-item"><i class="sw libre"></i> Libre <b>${c.libre}</b></span><span class="ley-item"><i class="sw reservada"></i> Reservada <b>${c.reservada}</b></span><span class="ley-item"><i class="sw ocupada"></i> Ocupada <b>${c.ocupada}</b></span><span class="ley-item llam${llam>0?' activo':''}"><i class="sw llam"></i> Llamando <b>${llam}</b></span>`;
}

let ac=null,sonidoOn=false;
function campanita(vol=1){if(!ac||ac.state!=='running')return;const t0=ac.currentTime+.02,out=ac.createGain();out.gain.value=.55*vol;out.connect(ac.destination);
  [[1046.5,0],[1318.5,.13],[1568,.26],[2093,.42]].forEach(([f,dt],i)=>{
    [[1,1],[2.76,.18],[5.4,.06]].forEach(([h,a])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f*h;
      const t=t0+dt,dur=i===3?1.1:.55;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a*(i===3?.9:.7),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur/h**.3);
      o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.05)})})}
function pintarSonido(){
  const b=$('btnSonido');
  b.textContent=sonidoOn?'Sonido activado':'Sonido apagado';
  b.setAttribute('aria-pressed',sonidoOn?'true':'false');
  b.setAttribute('aria-label',sonidoOn?'Sonido activado. Desactivar sonido':'Sonido apagado. Activar sonido');
}
async function activarSonido(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();await ac.resume();sonidoOn=ac.state==='running'}catch(e){sonidoOn=false}
  pintarSonido();if(sonidoOn)campanita(.6)}
function apagarSonido(){if(ac)ac.suspend();sonidoOn=false;pintarSonido()}
$('btnSonido').onclick=()=>{if(sonidoOn&&ac)apagarSonido();else activarSonido()};
function avisar(){campanita(1);navigator.vibrate&&navigator.vibrate([250,120,250])}
setInterval(()=>{if(pend.length&&sonidoOn)campanita(.5)},RECORDAR_CADA_S*1000);

const hace=t=>{const s=Math.max(0,Math.floor((Date.now()-new Date(t))/1000));return s<60?s+' s':Math.floor(s/60)+' min'};
function render(){
  const hay=pend.length>0;
  if(document.body.classList.contains('con-llamados')!==hay){document.body.classList.toggle('con-llamados',hay);dibujar();return}
  MESAS.forEach(m=>{const d=$('m'+m.id);if(d)d.classList.toggle('llamando',llamaMesa(m.id))});
  $('lista').innerHTML=pend.length?pend.map(p=>{const m=mesa(p.mesa_id)||{nombre:'#'+p.mesa_id};
    return `<div class="item"><div class="top"><b>${esc(m.nombre)}</b><span class="sal">${esc(m.zona||'')}</span></div>
    <div class="tipo">${TIPOS[p.tipo]||esc(p.tipo)}</div><small>hace ${hace(p.creado)}${p.nota?' · «'+esc(p.nota)+'»':''}</small>
    <button type="button" onclick="atender(${p.id})">Atendida</button></div>`}).join(''):'<p class="vacio-l">Sin llamados pendientes. Cuando un cliente toque la etiqueta, la mesa se marcará aquí.</p>';
  pintar();
}
setInterval(render,1000);
window.atender=async id=>{pend=pend.filter(p=>p.id!==id);render();if(sb)await sb.from('llamados').update({atendido_en:new Date().toISOString()}).eq('id',id).is('atendido_en',null)};

function hoyLocal(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bogota'}).format(new Date())}
function horaCorta(h){return String(h||'').slice(0,5)}
function activasHoy(lista){return (lista||[]).filter(r=>ESTADOS_ACTIVOS.includes(r.estado)).sort((a,b)=>String(a.hora).localeCompare(String(b.hora)))}
function pintarReservas(){
  const box=$('listaReservas'), n=$('nReservas'), lista=activasHoy(RESERVAS);
  if(n)n.textContent=lista.length?String(lista.length):'';
  if(!box)return;
  if(!lista.length){box.innerHTML='<p class="vacio-r">No hay reservas activas para hoy.</p>';return}
  box.innerHTML=lista.map(r=>{
    const m=mesa(r.mesa_id);
    const canal=CANAL[r.canal]||r.canal||'';
    const extras=[];
    if(r.con_mascota)extras.push('Mascota');
    if(r.celebracion)extras.push(FIESTA[r.celebracion]||r.celebracion);
    const pers=Number(r.comensales)===1?'1 persona':r.comensales+' personas';
    const mesaNom=m?m.nombre:('Mesa '+r.mesa_id);
    return `<article class="reserva"><div class="reserva-top"><b class="hora">${esc(horaCorta(r.hora))}</b><span class="tag${r.canal==='chatbot'?' santi':''}">${esc(canal)}</span></div><div class="nom">${esc(r.nombre_cliente)}</div><div class="meta">${esc(pers)} · ${esc(mesaNom)} · ${esc(ESTADO_TXT[r.estado]||r.estado)}</div>${extras.length?'<div class="extras">'+extras.map(x=>'<span class="tag fiesta">'+esc(x)+'</span>').join('')+'</div>':''}</article>`;
  }).join('');
}
async function cargarReservas(){
  if(!sb)return;
  const {data,error}=await sb.from('reservas').select('id,nombre_cliente,hora,comensales,mesa_id,estado,canal,celebracion,con_mascota').eq('restaurante_id',RESTAURANTE_ID).eq('fecha',hoyLocal()).in('estado',ESTADOS_ACTIVOS).order('hora');
  if(error){$('listaReservas').innerHTML='<p class="vacio-r">No pudimos cargar las reservas.</p>';return}
  RESERVAS=activasHoy(data);
  pintarReservas();
}
let debR;const refrescarReservas=()=>{clearTimeout(debR);debR=setTimeout(cargarReservas,400)};
function setEstado(modo){
  const el=$('estado');
  if(modo==='vivo')el.innerHTML='<i class="pto vivo"></i> En vivo';
  else if(modo==='recon')el.innerHTML='<i class="pto recon"></i> Reconectando…';
  else el.innerHTML='<i class="pto off"></i> Desconectado';
}
function mostrarSalir(on){$('btnSalir').hidden=!on}
$('btnSalir').onclick=async()=>{if(sb)await sb.auth.signOut();location.reload()};
$('buscar').addEventListener('input',()=>{busca=$('buscar').value;dibujar()});
document.querySelectorAll('.filtros button').forEach(b=>b.onclick=()=>{
  filtro=b.dataset.filtro;
  document.querySelectorAll('.filtros button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
  dibujar();
});
function cerrarListo(){$('activar').style.display='none'}
$('btnActivarListo').onclick=async()=>{await activarSonido();cerrarListo()};
$('btnAhoraNo').onclick=cerrarListo;
$('btnReservas').onclick=()=>{cargarReservas()};
$('verPw').onclick=()=>{
  const inp=$('pw'), ver=inp.type==='password';
  inp.type=ver?'text':'password';
  $('verPw').textContent=ver?'Ocultar':'Mostrar';
  $('verPw').setAttribute('aria-label',ver?'Ocultar contraseña':'Mostrar contraseña');
};

async function cargarMesas(){const {data}=await sb.from('mesas').select('id,nombre,zona,capacidad,forma,estado').eq('restaurante_id',RESTAURANTE_ID).eq('activa',true).order('nombre');
  MESAS=data||[];MESAS.forEach(m=>EST[m.id]=m.estado);dibujar();pintarReservas()}
async function cargarEstados(){if(!MESAS.length)return;
  const {data,error}=await sb.from('v_mesas_estado_actual').select('id,estado_efectivo').in('id',MESAS.map(m=>m.id));
  if(!error&&data)data.forEach(r=>EST[r.id]=r.estado_efectivo);pintar()}
async function cargarLlamados(){const {data}=await sb.from('llamados').select('*').eq('restaurante_id',RESTAURANTE_ID).is('atendido_en',null).order('creado');pend=data||[];render()}
let deb;const refrescarEstados=()=>{clearTimeout(deb);deb=setTimeout(cargarEstados,400)};
function conectar(){
  sb.channel('panel-caja')
   .on('postgres_changes',{event:'*',schema:'public',table:'llamados',filter:'restaurante_id=eq.'+RESTAURANTE_ID},p=>{
     if(p.eventType==='INSERT'&&!p.new.atendido_en&&!pend.some(x=>x.id===p.new.id)){pend.push(p.new);avisar()}
     if(p.eventType==='UPDATE'&&p.new.atendido_en)pend=pend.filter(x=>x.id!==p.new.id);render()})
   .on('postgres_changes',{event:'*',schema:'public',table:'mesas'},p=>{const n=p.new||{};
     if(p.eventType==='UPDATE'&&MESAS.some(m=>m.id===n.id)&&['nombre','zona','pos_x','pos_y','forma','activa'].every(k=>mesa(n.id)[k]===n[k]||k==='activa'&&n.activa)){mesa(n.id).estado=n.estado;refrescarEstados()}
     else cargarMesas().then(cargarEstados)})
   .on('postgres_changes',{event:'*',schema:'public',table:'reservas'},()=>{refrescarEstados();refrescarReservas()})
   .on('postgres_changes',{event:'*',schema:'public',table:'ordenes'},refrescarEstados)
   .subscribe(s=>{setEstado(s==='SUBSCRIBED'?'vivo':'recon');if(s==='SUBSCRIBED'){cargarMesas().then(()=>{cargarEstados();cargarReservas()});cargarLlamados()}});
  setInterval(()=>{cargarEstados();cargarReservas()},60000);
}
function listo(){$('login').remove();$('activar').style.display='flex'}
window.entrar=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
  if(error){$('lerr').textContent='Correo o contraseña incorrectos';return}mostrarSalir(true);listo();conectar()};

if(MOCK){MESAS=MOCK.mesas;MOCK.mesas.forEach(m=>EST[m.id]=m.estado);pend=MOCK.llamados||[];RESERVAS=MOCK.reservas||[];$('login').remove();
  if(!MOCK.mostrarActivar)$('activar').style.display='none';else $('activar').style.display='flex';
  if(MOCK.sesion)mostrarSalir(true);
  setEstado('vivo');dibujar();pintarReservas()}
else{const {data}=await sb.auth.getSession();if(data.session){mostrarSalir(true);listo();conectar()}}
</script>
</body>
</html>
